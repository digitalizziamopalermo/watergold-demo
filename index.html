<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestionale Watergold</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{--bg:#f3f5f8;--card:#fff;--text:#1c2633;--muted:#6b7785;--line:#e1e6ee;--brand:#0b7bc1;--ok:#2e9e5b;--warn:#d89b00;--danger:#d64541;--side:#0f2b40}
body{margin:0;font-family:system-ui,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
.app{display:flex;min-height:100vh}
.side{width:220px;background:var(--side);color:#fff;padding:18px 12px;flex-shrink:0;display:flex;flex-direction:column;gap:10px}
.brand{font-weight:700;font-size:20px;margin:0 8px;color:#e3b64b}
.who{margin:0 8px;font-size:13px;color:#cfe0ef}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{background:none;color:#cfe0ef;text-align:left;padding:9px 12px;border-radius:8px;font-size:14px}
.nav button.on,.nav button:hover{background:rgba(255,255,255,.12);color:#fff}
.logout{margin-top:auto}
.muted-l{font-size:11px;color:#8fa6ba;margin:0 8px}
main{flex:1;padding:24px;min-width:0}
h2{margin:0 0 6px;font-size:24px}
h3{margin:0 0 10px;font-size:17px}
.sec-head{margin-bottom:14px}
.desc{margin:0;color:var(--muted);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,.btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block}
button:disabled{opacity:.5;cursor:default}
button.ghost,.btn.ghost{background:#fff;color:var(--text);border:1px solid var(--line)}
button.danger{background:var(--danger)}
button.ok{background:var(--ok)}
button.sm{padding:5px 9px;font-size:13px}
button.big{padding:14px;font-size:16px;width:100%}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);max-width:100%}
textarea{width:100%;min-height:70px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--text);font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2 .full{grid-column:1/-1}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi span{display:block;color:var(--muted);font-size:13px}
.kpi b{font-size:22px}
.kpi.warn{border-color:var(--warn)}
.muted{color:var(--muted)}
.small{font-size:12px}
.empty{padding:10px 0}
.r{text-align:right}
.acts{white-space:nowrap}
.acts button{margin-left:4px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:600}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:#e8edf3;color:#334}
.badge.completato{background:#dff3e7;color:#18703f}
.badge.programmato{background:#e1effa;color:#0b5a8f}
.badge.in_corso{background:#fff1cc;color:#8a6100}
.badge.annullato{background:#fde2e1;color:#a52a27}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.col{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:120px}
.colh{display:flex;justify-content:space-between;border-left:4px solid;padding-left:8px;margin-bottom:10px}
.appt{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fbfcfe}
.appt .at{margin-bottom:4px}
.note{font-size:13px;color:var(--muted);font-style:italic;margin-top:4px}
.row-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.row-acts select{padding:4px}
.rowline{padding:8px 0;border-bottom:1px solid var(--line)}
.todo{padding-left:0;list-style:none;margin:0}
.todo li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.mat-row{display:flex;gap:6px;margin-bottom:6px}
.mat-row select{flex:1}
.mat-row input{width:80px}
.giro{background:var(--card);border:1px solid var(--line);border-left:5px solid;border-radius:12px;padding:14px;margin-bottom:12px}
.giro .time{font-size:20px;font-weight:700}
.giro .links{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.giro .links a{font-size:14px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;color:var(--brand);text-decoration:none;background:#fff}
.giro .stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.bars{display:flex;gap:10px;align-items:flex-end;height:230px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar{width:100%;background:var(--brand);border-radius:6px 6px 0 0;min-height:2px}
.scan{border:2px solid var(--brand);border-radius:12px;padding:14px;margin-bottom:14px;background:#f4fafe}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;width:min(400px,100%);display:flex;flex-direction:column;gap:12px}
.login-box .brand{color:var(--side);margin:0;font-size:26px}
.err{color:var(--danger);margin:0}
.hint{background:#f4f6f9;border-radius:8px;padding:10px;font-size:13px;color:var(--muted)}
#modal{position:fixed;inset:0;background:rgba(10,20,30,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal.open{display:flex}
#modal-box{background:#fff;border-radius:14px;width:min(680px,100%);max-height:90vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh h3{margin:0}
.mb{padding:18px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.qr-card{text-align:center}
#qr-box{display:flex;justify-content:center;margin-bottom:12px}
@media (max-width:760px){
  .app{flex-direction:column}
  .side{width:100%;padding:10px}
  .nav{flex-direction:row;overflow-x:auto}
  .nav button{white-space:nowrap}
  .logout{margin-top:0}
  .grid2{grid-template-columns:1fr}
  main{padding:16px}
}
@media print{
  .side,.top,.kpis,.sec-head,.card:not(.qr-card){display:none!important}
  .qr-card{box-shadow:none;border:0}
}
/* ===== v5: tema chiaro/scuro, layout adattivo (PC, tablet, cellulare) ===== */
:root{--soft:#f4f6f9;--soft2:#fbfcfe;--input:#fff;--shadow:0 10px 40px rgba(0,0,0,.25)}
[data-theme="dark"]{--bg:#0e1620;--card:#162331;--text:#e6edf5;--muted:#8fa1b3;--line:#263749;--brand:#3ba3e6;--side:#0a131c;--soft:#1b2b3b;--soft2:#1a2a3a;--input:#0f1b27;--shadow:0 10px 40px rgba(0,0,0,.6)}
[data-theme="dark"] input,[data-theme="dark"] select,[data-theme="dark"] textarea{background:var(--input);color:var(--text);border-color:var(--line)}
[data-theme="dark"] button.ghost,[data-theme="dark"] .btn.ghost{background:var(--card);color:var(--text);border-color:var(--line)}
[data-theme="dark"] .appt,[data-theme="dark"] .giro .links a{background:var(--soft2)}
[data-theme="dark"] .scan{background:var(--soft2)}
[data-theme="dark"] .hint{background:var(--soft)}
[data-theme="dark"] .badge{background:#253a4f;color:#cfe0ef}
[data-theme="dark"] .badge.completato{background:#133b28;color:#7fd7a4}
[data-theme="dark"] .badge.programmato{background:#12354f;color:#8cc8f2}
[data-theme="dark"] .badge.in_corso{background:#4a3a0c;color:#ffd976}
[data-theme="dark"] .badge.annullato{background:#4a1716;color:#ffaaa7}
[data-theme="dark"] #modal{background:rgba(0,0,0,.65)}
[data-theme="dark"] #modal-box,[data-theme="dark"] #auth-box{background:var(--card)}
[data-theme="dark"] .mh,[data-theme="dark"] .mf{border-color:var(--line)}
[data-theme="dark"] .login-box{background:var(--card)}
[data-theme="dark"] .side{border-right:1px solid var(--line)}
.side .tbtn{background:rgba(255,255,255,.08);color:#fff;text-align:left;display:flex;align-items:center;gap:6px;font-size:14px;padding:9px 12px;border-radius:8px}
.side .tbtn:hover{background:rgba(255,255,255,.16)}
.side .clock{font-size:13px;color:#cfe0ef;margin:0 8px}
.ic{display:inline-block;width:24px;text-align:center}
.nav button{display:flex;align-items:center;gap:4px}
.demo-note{font-size:11px;color:#8fa6ba;margin:0 8px;line-height:1.4}
.greet{background:linear-gradient(135deg,var(--brand),#0f2b40);color:#fff;border-radius:14px;padding:18px 20px;margin-bottom:14px}
.greet h3{color:#fff;font-size:21px;margin:0 0 4px}
.greet p{margin:0;opacity:.9;font-size:14px}
.mhead{display:none}
.mhead .brand{margin:0;font-size:18px}
.mhead .clock{font-size:12px;color:#cfe0ef;margin:0}
.mhead .tbtn{padding:6px 10px;font-size:13px}
.mhead .tbtn .lbl{display:inline}
.mhead > div:first-child{display:flex;flex-direction:column}
.badge{white-space:nowrap}
@media (min-width:761px) and (max-width:1024px){
  .side{width:78px;padding:12px 6px;align-items:stretch}
  .brand,.who,.demo-note,.side .clock,.side .lbl{display:none}
  .nav button{justify-content:center;padding:10px 4px}
  .nav .ic{width:auto;font-size:18px}
  .side .tbtn{justify-content:center;padding:10px 4px}
  main{padding:18px}
  .kpis{grid-template-columns:repeat(3,1fr)}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:760px){
  body{font-size:16px;-webkit-text-size-adjust:100%}
  .app{display:block}
  .mhead{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;z-index:6;background:var(--side);color:#fff;padding:10px 14px}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;height:68px;flex-direction:row;padding:4px 4px calc(4px + env(safe-area-inset-bottom));gap:0;z-index:6;box-shadow:0 -4px 16px rgba(0,0,0,.18);align-items:stretch}
  .side .brand,.side .who,.side .demo-note,.side .clock,.side .tbtn,.side .logout-b{display:none}
  .nav{flex-direction:row;flex:1;overflow-x:auto;gap:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{flex:0 0 auto;min-width:66px;flex-direction:column;justify-content:center;gap:2px;padding:6px 4px;font-size:11px;text-align:center;border-radius:10px;line-height:1.15}
  .nav .ic{width:auto;font-size:20px}
  main{padding:14px 12px 100px}
  h2{font-size:21px}
  .sec-head .desc{font-size:13px}
  .grid2{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .kpi{padding:10px}
  .kpi b{font-size:18px}
  .greet{padding:14px}
  .top{flex-direction:column;align-items:stretch}
  .top .actions,.actions{width:100%}
  .actions input,.actions select,.top input,.top select{width:100%;min-width:0!important}
  .actions label{width:100%}
  .actions label input,.actions label select{width:auto}
  .actions > button{flex:1 1 auto}
  .cols{grid-template-columns:1fr}
  .tbl-wrap table,.tbl-wrap thead,.tbl-wrap tbody,.tbl-wrap tr,.tbl-wrap td,.tbl-wrap th{display:block;width:100%}
  .tbl-wrap thead{display:none}
  .tbl-wrap tr{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:10px;background:var(--card)}
  .tbl-wrap td{border:0;padding:3px 0;text-align:left!important}
  .tbl-wrap td[data-label]::before{content:attr(data-label);display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .tbl-wrap td.acts{white-space:normal;padding-top:8px}
  .tbl-wrap td.acts button{margin:4px 6px 0 0;padding:8px 12px}
  .acts{white-space:normal}
  .acts button{margin:4px 4px 0 0}
  .row-acts select{flex:1 1 100%}
  .row-acts button{flex:1 1 auto}
  .giro{padding:14px}
  .giro .time{font-size:18px}
  .giro .stat{grid-template-columns:1fr 1fr}
  .giro button{width:100%;padding:12px;font-size:15px}
  .giro .links a{flex:1 1 auto;text-align:center}
  .bars{height:190px}
  .scan input{min-width:0!important;width:100%}
  #modal{padding:0;align-items:flex-end}
  #modal-box{width:100%;max-height:92vh;border-radius:18px 18px 0 0}
  #modal-box .mb{padding:14px}
  .mf button{flex:1}
  .mhead{display:flex}
  html,body{max-width:100%;overflow-x:hidden}
  main,.giro,.col,.card{min-width:0;max-width:100%}
  .actions > button.sm,.actions > .btn.sm{flex:0 0 auto}
  .giro .stat{grid-template-columns:repeat(2,minmax(0,1fr))}
  .giro .links a{min-width:0;overflow-wrap:anywhere;flex:1 1 100%}
  .giro .links{flex-direction:column}
  .giro .links a{text-align:left}
  .card .actions{max-width:100%}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>
<div id="login" class="login" hidden></div>
<div id="app" hidden>
  <header class="mhead">
    <div><span class="brand">Watergold</span><span class="clock"></span></div>
    <div class="actions" style="width:auto;flex-direction:row">
      <button class="tbtn" onclick="toggleTheme()"><span class="ic">🌓</span></button>
      <button class="tbtn" onclick="logout()"><span class="ic">🚪</span></button>
    </div>
  </header>
  <aside class="side">
    <div class="brand">Watergold</div>
    <div id="who" class="who"></div>
    <div class="clock"></div>
    <nav class="nav" id="nav"></nav>
    <button class="tbtn" onclick="toggleTheme()"><span class="ic">🌓</span><span class="lbl tlabel">Tema</span></button>
    <button class="tbtn logout-b" onclick="logout()"><span class="ic">🚪</span><span class="lbl">Esci</span></button>
    <div class="demo-note">Versione dimostrativa con dati fittizi. Dati salvati su questo dispositivo.</div>
  </aside>
  <main id="main"></main>
</div>
<div id="modal" onclick="if(event.target===this)closeModal()"><div id="modal-box"></div></div>

<script>
const KEY = 'watergold-v5';
const ME_KEY = 'watergold-v5-me';
const STATUS = {programmato:'Programmato', in_corso:'In corso', completato:'Completato', annullato:'Annullato'};
const MESI = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const COLORS = ['#0b7bc1','#2e9e5b','#b7791f','#8e44ad','#d64541','#16a085'];
const DEFAULT_SERVICES = [
  {name:'Manutenzione ordinaria', price:80},
  {name:'Riparazione guasto', price:120},
  {name:'Installazione', price:250},
  {name:'Sopralluogo', price:50},
  {name:'Visita contratto mensile', price:60}
];
const SECTIONS = [
  {id:'dash', t:'Panoramica', roles:['admin'], d:'Riepilogo della giornata: interventi, incassi, scorte da riordinare e automazioni eseguite.'},
  {id:'agenda', t:'Agenda', roles:['admin','tecnico'], d:'Interventi del giorno per tecnico. La segreteria crea e assegna gli appuntamenti; il tecnico vede i propri e aggiorna lo stato.'},
  {id:'giro', t:'Il mio giro', roles:['admin','tecnico'], d:'Vista da telefono: indirizzi su mappa, chiamata al cliente, stato dell\'intervento, materiali usati, firma del cliente e rapporto stampabile.'},
  {id:'clienti', t:'Clienti', roles:['admin','tecnico'], d:'Anagrafica di circa 3.000 clienti: ricerca, filtri, scheda con storico. Modifica, importazione e privacy riservate alla segreteria.'},
  {id:'magazzino', t:'Magazzino', roles:['admin','tecnico'], d:'Giacenze, scanner dei codici articolo per carichi e scarichi rapidi, inventario fisico e ordini suggeriti ai fornitori.'},
  {id:'promemoria', t:'Promemoria', roles:['admin'], d:'Interventi di domani con il messaggio di promemoria già scritto: un tocco per cliente su WhatsApp.'},
  {id:'messaggi', t:'Comunicazioni', roles:['admin'], d:'Comunicazioni mensili a tutti i clienti con consenso, con invio guidato e file dei contatti per la lista di trasmissione WhatsApp.'},
  {id:'fatture', t:'Fatture', roles:['admin'], d:'Fatture per cliente, generazione automatica di fine mese, incassi, stampa ed esportazione per il commercialista.'},
  {id:'report', t:'Report', roles:['admin'], d:'Andamento del fatturato degli ultimi sei mesi, carico di lavoro dei tecnici e clienti più importanti.'},
  {id:'automazioni', t:'Automazioni', roles:['admin'], d:'Regole che lavorano da sole (scarichi, fatture, visite, promemoria, scorte, scadenze). Puoi attivarle o disattivarle e leggere il registro.'},
  {id:'dati', t:'Dati e fogli', roles:['admin'], d:'Esporta ed importa clienti e magazzino in Excel o Google Sheets, con riconoscimento dei duplicati. Backup completo dei dati.'},
  {id:'qr', t:'QR code', roles:['admin'], d:'Genera il QR code del sito da stampare su biglietti, vetrina o furgone.'},
  {id:'impost', t:'Impostazioni', roles:['admin'], d:'Dati azienda, IVA, servizi e prezzi, modelli di messaggio, utenti e ruoli.'}
];
const RULES = [
  ['scarico','Scarico magazzino automatico','Alla chiusura di un intervento i materiali usati vengono scaricati dal magazzino.'],
  ['fatturaMese','Fatture di fine mese','Se restano interventi completati non fatturati del mese precedente, crea le fatture per cliente.'],
  ['visiteMensili','Visite dei contratti','Crea le visite del mese per i clienti con contratto mensile, se non esistono già.'],
  ['promemoria','Promemoria del giorno prima','Registra quanti promemoria sono pronti per gli interventi di domani.'],
  ['scorte','Allerta scorte','Registra quanti articoli sono sotto scorta minima.'],
  ['scaduti','Fatture scadute','Segnala le fatture non incassate da più di 30 giorni.']
];

const $ = s => document.querySelector(s);
const val = id => document.getElementById(id).value;
const chk = id => document.getElementById(id).checked;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => Number(n || 0).toLocaleString('it-IT', {style:'currency', currency:'EUR'});
const round2 = n => Math.round(n * 100) / 100;
const pad = (n, w = 2) => String(n).padStart(w, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (n, base = new Date()) => { const d = new Date(base); d.setDate(d.getDate() + n); return ymd(d); };
const fmtDate = s => { const [y,m,d] = s.split('-'); return `${d}/${m}/${y}`; };
const fmtLong = s => new Date(s + 'T12:00:00').toLocaleDateString('it-IT', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
const fmtStamp = iso => new Date(iso).toLocaleString('it-IT', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
const monthOf = s => s.slice(0, 7);
const mesLabel = ym => { const [y,m] = ym.split('-'); return MESI[+m-1] + ' ' + y; };
const lastDayOf = ym => { const [y,m] = ym.split('-').map(Number); return ymd(new Date(y, m, 0)); };
const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60 + m; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const byId = (arr, id) => arr.find(x => x.id === id);
const digitsOf = p => String(p || '').replace(/\D/g, '');
const byTime = (a,b) => a.time.localeCompare(b.time);
const byDateTime = (a,b) => (a.date + a.time).localeCompare(b.date + b.time);
const yes = v => /^(si|sì|s|yes|1|x|true)$/i.test(String(v ?? '').trim());
const normH = h => String(h).normalize('NFD').replace(/[̀-ͯ]/g,'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
const kpi = (label, v, cls = '') => `<div class="kpi ${cls}"><span>${label}</span><b>${v}</b></div>`;
function csvOf(rows){
  return '﻿' + rows.map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(';')).join('\r\n');
}
function downloadFile(name, type, content){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], {type}));
  a.download = name;

function writeTable(rows, base, fmt){
  if (fmt === 'xlsx') {
    if (typeof XLSX === 'undefined') return alert('Libreria Excel non caricata (serve la connessione internet). Usa il formato CSV.');
    const wb = XLSX.utils.book_new();

// Lettore CSV che rispetta le virgolette e rileva il separatore (; oppure ,)
function parseCsv(text){
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const sep = first.split(';').length >= first.split(',').length ? ';' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === sep) { row.push(cur); cur = ''; }
    else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (ch !== '\r') cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ''));
}
// Hash semplice per la demo locale. Per la sicurezza reale useremo l'autenticazione del database.
function hashPw(s){ let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return 'h' + (h >>> 0).toString(16); }
function rng(seed){
  return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

  if (a.status !== 'completato' || a.stockApplied || !db.settings.rules.scarico) return;
  (a.materials || []).forEach(m => moveStock(m.itemId, 'scarico', m.qty, `Intervento ${fmtDate(a.date)} - ${cname(a.clientId)}`, true));
  a.stockApplied = true;

// Movimento di magazzino (carico o scarico); con silent=true non fa commit
function moveStock(itemId, type, qty, note, silent = false){
  const it = byId(db.items, itemId);
  if (!it) return;
  const delta = type === 'carico' ? qty : -qty;
  it.qty = round2(it.qty + delta);
  db.movements.push({id:uid(), date:ymd(new Date()), itemId, qty:delta, type, note: note || ''});
  if (!silent) commit();
}
// Ricalcola il magazzino quando si cambiano i materiali di un intervento già scaricato
function adjustStock(a, oldMats, newMats){
  if (!a.stockApplied) return;
  const ids = new Set([...oldMats, ...newMats].map(m => m.itemId));
  ids.forEach(id => {
    const o = oldMats.filter(m => m.itemId === id).reduce((s,m) => s + m.qty, 0);
    const n = newMats.filter(m => m.itemId === id).reduce((s,m) => s + m.qty, 0);
    if (o !== n) moveStock(id, o > n ? 'carico' : 'scarico', Math.abs(o - n), 'Rettifica materiali intervento', true);
  });
}
function nextNumber(date, dbx = db){
  const y = date.slice(0,4);
  const max = dbx.invoices.filter(i => i.number.startsWith(y + '/')).reduce((m,i) => Math.max(m, +i.number.split('/')[1]), 0);
  return y + '/' + pad(max + 1, 4);
}
function createInvoice(cid, apps, date = ymd(new Date()), dbx = db, quiet = false){
  const lines = [];
  apps.forEach(a => {
    lines.push({desc:`${a.service} - ${fmtDate(a.date)}${a.address ? ' - ' + a.address : ''}`, qty:1, price:a.price});
    (a.materials || []).forEach(m => {
      const it = byId(dbx.items, m.itemId);
      if (it) lines.push({desc:`Materiale: ${it.name}`, qty:m.qty, price:it.price});
    });
  });
  const imponibile = round2(lines.reduce((s,l) => s + l.qty * l.price, 0));
  const rate = dbx.settings.vatRate;
  const inv = {id:uid(), number:nextNumber(date, dbx), date, clientId:cid, lines, imponibile, ivaRate:rate,
    totale:round2(imponibile * (1 + rate / 100)), status:'da incassare', apptIds:apps.map(a => a.id)};
  dbx.invoices.push(inv);
  return inv;

  const pend = pendingAppts(ym);
  if (!pend.length) return 0;
  const groups = {};
  pend.forEach(a => { (groups[a.clientId] = groups[a.clientId] || []).push(a); });
  const today = ymd(new Date());
  const date = ym === today.slice(0,7) ? today : lastDayOf(ym);
  Object.entries(groups).forEach(([cid, apps]) => createInvoice(cid, apps, date));

// Automazioni giornaliere: eseguite una volta al giorno all'accesso, oppure forzate dal pulsante
function runDaily(force){
  const today = ymd(new Date());
  if (!force && db.lastDaily === today) return;
  const r = db.settings.rules;
  const ym = today.slice(0,7);
  const prev = ymd(new Date(new Date().getFullYear(), new Date().getMonth() - 1, 1)).slice(0,7);
  if (r.visiteMensili) { const n = genMonthlyVisits(ym); if (n) logAct(`Create ${n} visite dei contratti per ${mesLabel(ym)}`); }
  if (r.fatturaMese) { const n = autoInvoice(prev); if (n) logAct(`Create ${n} fatture di ${mesLabel(prev)}`); }
  if (r.promemoria) { const n = db.appointments.filter(a => a.date === addDays(1) && a.status === 'programmato').length; if (n) logAct(`${n} promemoria pronti per domani`); }
  if (r.scorte) { const n = reorderList().length; if (n) logAct(`${n} articoli sotto scorta da riordinare`); }
  if (r.scaduti) { const lim = addDays(-30); const n = db.invoices.filter(i => i.status === 'da incassare' && i.date < lim).length; if (n) logAct(`${n} fatture non incassate da oltre 30 giorni`); }
  logAct('Automazioni giornaliere eseguite');
  db.lastDaily = today;
  save();
}

function saveAppt(id){
  if (!requireAdmin()) return;
  const a = {
    date: val('f-date'), time: val('f-time'), duration: +val('f-dur') || 60,
    clientId: val('f-clientid'), techId: val('f-tech'), service: val('f-service'), price: +val('f-price') || 0,
    address: val('f-address').trim(), notes: val('f-notes').trim(), status: val('f-status'), materials: readMats()
  };
  if (!a.date || !a.time || !a.clientId) return alert('Compila data, ora e cliente (scegli un cliente dall\'elenco).');
  const start = toMin(a.time), end = start + a.duration;
  const clash = db.appointments.find(x => x.id !== id && x.date === a.date && x.techId === a.techId && x.status !== 'annullato' && toMin(x.time) < end && toMin(x.time) + x.duration > start);
  if (clash && !confirm(`Il tecnico ha già un intervento alle ${clash.time}. Salvare comunque?`)) return;
  let x;
  if (id) {
    x = byId(db.appointments, id);
    const oldMats = x.materials || [];
    Object.assign(x, a);
    adjustStock(x, oldMats, a.materials);
  } else {
    x = {id:uid(), ...a, stockApplied:false};
    db.appointments.push(x);
  }
  applyStock(x);
  closeModal();
  commit();
}

function firmaForm(id){
  modal('Firma del cliente', `<p class="muted small">Chiedi al cliente di firmare nel riquadro con il dito o con il mouse.</p>
    <canvas id="sig" width="600" height="220" style="width:100%;border:1px solid var(--line);border-radius:8px;touch-action:none;background:#fff"></canvas>
    <label style="margin-top:10px">Firmato da<input id="sig-name" placeholder="Nome e cognome"></label>`,
    `<button class="ghost" onclick="sigClear()">Cancella</button><button class="ghost" onclick="closeModal()">Annulla</button><button onclick="sigSave('${id}')">Salva firma</button>`);
  const cv = document.getElementById('sig');
  const ctx = cv.getContext('2d');
  ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.strokeStyle = '#0f2b40';
  let drawing = false;
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  cv.onpointerdown = e => { drawing = true; const [x,y] = pos(e); ctx.beginPath(); ctx.moveTo(x,y); cv.setPointerCapture(e.pointerId); };
  cv.onpointermove = e => { if (!drawing) return; const [x,y] = pos(e); ctx.lineTo(x,y); ctx.stroke(); };
  cv.onpointerup = cv.onpointerleave = () => { drawing = false; };
}
function sigClear(){
  const cv = document.getElementById('sig');
  cv.getContext('2d').clearRect(0, 0, cv.width, cv.height);
}
function sigSave(id){
  const cv = document.getElementById('sig');
  const blank = document.createElement('canvas'); blank.width = cv.width; blank.height = cv.height;
  const url = cv.toDataURL('image/png');
  if (url === blank.toDataURL('image/png')) return alert('Il cliente non ha ancora firmato.');
  const a = byId(db.appointments, id);
  a.signature = url;
  a.signedBy = val('sig-name').trim() || 'Cliente';
  a.signedAt = new Date().toISOString();
  logAct(`Firma raccolta per ${cname(a.clientId)} da ${a.signedBy}`);
  closeModal();
  commit();
}

function applyInv(){
  let n = 0;
  document.querySelectorAll('[data-inv]').forEach(inp => {
    if (inp.value === '') return;
    const it = byId(db.items, inp.dataset.inv);
    const diff = round2(+inp.value - it.qty);
    if (diff !== 0) { moveStock(it.id, diff > 0 ? 'carico' : 'scarico', Math.abs(diff), 'Rettifica da inventario fisico', true); n++; }
  });
  logAct(`Inventario fisico: ${n} articoli rettificati`);
  closeModal();
  commit();
  alert(`Inventario confermato: ${n} articoli rettificati.`);
}

      .map(i => [i.supplier, i.code, i.name, i.qty, i.daOrdinare, i.unit]));

}

/* ---------- COMUNICAZIONI (WhatsApp gratuito) ---------- */
function waMessage(c, ym){
  const apps = completedIn(c.id, ym);
  const total = apps.reduce((s,a) => s + appTotal(a), 0);
  return db.settings.waTemplate
    .replaceAll('{nome}', c.name).replaceAll('{mese}', mesLabel(ym))
    .replaceAll('{importo}', eur(total)).replaceAll('{interventi}', apps.length).replaceAll('{sito}', db.settings.site);
}
function waList(ym){
  const sent = db.sentWa[ym] || [];
  return db.clients.filter(c => c.whatsappOk && digitsOf(c.phone) && (!ui.waOnly || c.monthly) && (!ui.waHideSent || !sent.includes(c.id)));
}
function viewWa(){
  const ym = ui.waMonth;
  const sent = db.sentWa[ym] || [];
  const list = waList(ym);
  return `
  <div class="top"><div class="actions"><label>Mese di riferimento <input type="month" value="${ym}" onchange="ui.waMonth=this.value;render()"></label></div></div>
  <div class="card"><h3>Modello messaggio</h3>

    <p class="muted small" style="margin-top:0">Il gestionale non può inviare messaggi da solo con WhatsApp gratuito. Ogni clic apre la chat del cliente con il testo già scritto: tu premi Invia.</p>
    <div class="actions">
      <button class="big" style="width:auto" onclick="sendNext('${ym}')" ${list.length ? '' : 'disabled'}>Apri la chat successiva (${list.length} da inviare)</button>
      <button class="ghost" onclick="exportContactsVcf()">Esporta contatti (.vcf) per lista WhatsApp</button>
      <button class="ghost" onclick="resetSent('${ym}')">Azzera invii del mese</button>
    </div>
    <p class="muted small">Lista di trasmissione: importa il .vcf nel telefono, poi in WhatsApp crea una lista con quei contatti e invia il messaggio a tutti con un tocco. Usalo solo per i clienti che hanno dato il consenso.</p>
  </div>
  <div class="card"><h3>Ancora da inviare questo mese: ${list.length} · già inviati: ${sent.length}</h3>
    <div class="tbl-wrap"><table><thead><tr><th>Cliente</th><th>Telefono</th><th class="r">Interventi nel mese</th><th></th></tr></thead><tbody>
    ${list.slice(0, 100).map(c => { const apps = completedIn(c.id, ym); return `<tr><td><b>${esc(c.name)}</b>${c.monthly ? '<br><small class="muted">Contratto mensile</small>' : ''}</td><td>${esc(c.phone)}</td><td class="r">${apps.length} · ${eur(apps.reduce((s,a) => s + appTotal(a), 0))}</td><td class="acts"><button class="sm" onclick="sendWa('${c.id}','${ym}')">Apri chat</button></td></tr>`; }).join('') || '<tr><td colspan="4" class="muted">Nessun cliente da contattare</td></tr>'}
    </tbody></table></div>
    ${list.length > 100 ? `<p class="muted small">Mostrati i primi 100. Usa "Apri la chat successiva" per proseguire.</p>` : ''}

}
function sendWa(cid, ym){
  const c = byId(db.clients, cid);
  window.open(`https://wa.me/${digitsOf(c.phone)}?text=${encodeURIComponent(waMessage(c, ym))}`, '_blank');
  db.sentWa[ym] = [...new Set([...(db.sentWa[ym] || []), cid])];
  commit();
}
function sendNext(ym){
  const next = waList(ym)[0];
  if (!next) return alert('Nessun altro cliente da contattare per questo mese.');
  sendWa(next.id, ym);
}
function resetSent(ym){
  if (!confirm('Azzerare la lista degli invii di questo mese?')) return;
  delete db.sentWa[ym];
  commit();
}
function exportContactsVcf(){
  const list = db.clients.filter(c => c.whatsappOk && digitsOf(c.phone) && c.consentDate);
  const txt = list.map(c => `BEGIN:VCARD\nVERSION:3.0\nFN:${c.name}\nTEL;TYPE=CELL:${c.phone}\nEND:VCARD`).join('\n');
  downloadFile('contatti-clienti-watergold.vcf', 'text/vcard;charset=utf-8', txt);
}

function viewReport(){
  const months = [];
  for (let i = 5; i >= 0; i--) { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); months.push(ymd(d).slice(0,7)); }
  const vals = months.map(m => db.invoices.filter(i => monthOf(i.date) === m).reduce((s,i) => s + i.imponibile, 0));
  const max = Math.max(1, ...vals);
  const bars = months.map((m,k) => `<div class="bar-col"><small class="muted">${eur(vals[k])}</small><div class="bar" style="height:${Math.round(vals[k] / max * 170)}px"></div><small>${MESI[+m.slice(5) - 1].slice(0,3)}</small></div>`).join('');
  const ym = ymd(new Date()).slice(0,7);
  const tRows = tecnici().map(t => {
    const apps = db.appointments.filter(a => a.techId === t.id && monthOf(a.date) === ym && a.status === 'completato');
    const ore = apps.reduce((s,a) => s + a.duration, 0) / 60;
    return `<tr><td>${esc(t.name)}</td><td class="r">${apps.length}</td><td class="r">${ore.toFixed(1)} h</td></tr>`;

  const byC = {};

  const top = Object.entries(byC).sort((a,b) => b[1] - a[1]).slice(0, 10)
    .map(([id,v]) => `<tr><td>${esc(cname(id))}</td><td class="r">${eur(v)}</td></tr>`).join('');
  return `
  <div class="card"><h3>Fatturato imponibile ultimi 6 mesi</h3><div class="bars">${bars}</div></div>
  <div class="grid2">
    <div class="card"><h3>Carico tecnici (${mesLabel(ym)})</h3><div class="tbl-wrap"><table>

function importClients(input){
  if (!requireAdmin()) return;
  const f = input.files[0];
  if (!f) return;
  const isX = /\.xlsx?$/i.test(f.name);
  const reader = new FileReader();
  reader.onload = () => {
    let rows;
    try {
      if (isX) {
        if (typeof XLSX === 'undefined') throw new Error('libreria Excel non caricata (serve la connessione internet). Usa il CSV.');
        const wb = XLSX.read(reader.result, {type:'array'});
        rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:''});
      } else rows = parseCsv(reader.result);
    } catch(e) { return alert('Import non riuscito: ' + e.message); }
    planImport(rows);
  };
  if (isX) reader.readAsArrayBuffer(f); else reader.readAsText(f);
  input.value = '';
}
function planImport(rows){
  if (rows.length < 2) return alert('Il file è vuoto o non contiene righe di dati.');
  const H = rows[0].map(normH);
  const col = (...names) => { for (const n of names) { const i = H.indexOf(n); if (i >= 0) return i; } return -1; };
  const ix = {codice:col('codice','codice_cliente','id'), name:col('nome','ragione_sociale','nome_cliente','cliente'), type:col('tipo'),
    phone:col('telefono','cellulare','tel'), email:col('email','mail'), address:col('indirizzo'), cap:col('cap'),
    city:col('citta','comune','localita'), vat:col('piva','p_iva','partita_iva','cf','codice_fiscale'), sdi:col('sdi','codice_sdi'),
    pec:col('pec'), monthly:col('mensile','contratto_mensile'), wa:col('consenso_whatsapp','whatsapp'), notes:col('note')};
  if (ix.name < 0) return alert('Colonna "nome" non trovata. Intestazioni lette: ' + H.join(', '));
  const plan = {upd:[], add:[], dup:[], err:0};
  const phones = new Set(db.clients.map(c => digitsOf(c.phone)).filter(Boolean));
  const vats = new Set(db.clients.map(c => c.vat).filter(Boolean));
  const byCode = new Map(db.clients.map(c => [c.codice, c]));
  rows.slice(1).forEach(r => {
    const g = k => ix[k] >= 0 ? String(r[ix[k]] ?? '').trim() : '';
    const name = g('name');
    if (!name) { plan.err++; return; }
    const data = {name, type: /azienda/i.test(g('type')) ? 'azienda' : 'privato', phone:g('phone'), email:g('email'), address:g('address'),
      cap:g('cap'), city:g('city'), vat:g('vat'), sdi:g('sdi'), pec:g('pec'), monthly:yes(g('monthly')), whatsappOk:yes(g('wa')), notes:g('notes')};
    const ex = g('codice') ? byCode.get(g('codice')) : null;
    if (ex) { plan.upd.push({ex, data}); return; }
    const dig = digitsOf(data.phone);
    if ((dig && phones.has(dig)) || (data.vat && vats.has(data.vat))) { plan.dup.push(name); return; }
    if (dig) phones.add(dig);
    if (data.vat) vats.add(data.vat);
    plan.add.push(data);
  });
  pendingPlan = plan;
  const changed = plan.upd.filter(({ex, data}) => ['name','phone','email','address','city','cap','vat','monthly','whatsappOk','notes']
    .some(k => String(ex[k] ?? '') !== String(data[k] ?? ''))).length;
  modal('Anteprima importazione', `
    <ul class="stack small">
      <li><b>${changed}</b> clienti esistenti da aggiornare (su ${plan.upd.length} riconosciuti dal codice)</li>
      <li><b>${plan.add.length}</b> nuovi clienti da aggiungere</li>
      <li><b>${plan.dup.length}</b> duplicati saltati (telefono o P.IVA già presenti)${plan.dup.length ? ': ' + esc(plan.dup.slice(0,8).join(', ')) + (plan.dup.length > 8 ? '…' : '') : ''}</li>
      <li><b>${plan.err}</b> righe senza nome, ignorate</li>
    </ul>
    <p class="muted small">I campi vuoti nel file sostituiscono i valori attuali dei clienti aggiornati. Controlla il file prima di confermare.</p>`,
    `<button class="ghost" onclick="pendingPlan=null;closeModal()">Annulla</button><button onclick="applyImport()">Conferma importazione</button>`);
}
function applyImport(){
  if (!pendingPlan || !requireAdmin()) return;
  const plan = pendingPlan;
  let upd = 0;
  plan.upd.forEach(({ex, data}) => {
    const before = JSON.stringify(ex);
    Object.assign(ex, data);
    if (data.whatsappOk && !ex.consentDate) ex.consentDate = ymd(new Date());
    if (JSON.stringify(ex) !== before) upd++;
  });
  let n = maxCode();
  plan.add.forEach(d => {
    n++;
    db.clients.push({id:'c' + uid(), codice:'C' + pad(n, 5), ...d, consentDate: d.whatsappOk ? ymd(new Date()) : ''});
  });
  logAct(`Import clienti: ${upd} aggiornati, ${plan.add.length} nuovi, ${plan.dup.length} duplicati saltati`);
  pendingPlan = null;
  closeModal();
  commit();
  alert(`Importazione completata: ${upd} aggiornati, ${plan.add.length} nuovi, ${plan.dup.length} duplicati saltati.`);
}

      <label>Nome e cognome<input id="u-name" value="${esc(u.name)}"></label>
      <label>Email (per l'accesso)<input id="u-email" type="email" value="${esc(u.email)}"></label>
      <label>Ruolo<select id="u-role"><option value="tecnico" ${u.role === 'tecnico' ? 'selected' : ''}>Tecnico</option><option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Titolare / segreteria</option></select></label>
      <label>Telefono<input id="u-phone" value="${esc(u.phone)}"></label>
      <label>Colore in agenda<input id="u-color" type="color" value="${u.color}"></label>
      <label>Password ${id ? '(lascia vuoto per non cambiarla)' : ''}<input id="u-pass" type="password"></label>
    </div>`,
    `<button class="ghost" onclick="closeModal()">Annulla</button><button onclick="saveUser('${id || ''}')">Salva</button>`);
}
function saveUser(id){
  if (!requireAdmin()) return;
  const name = val('u-name').trim(), email = val('u-email').trim().toLowerCase(), role = val('u-role'), pass = val('u-pass');
  if (!name || !email) return alert('Nome ed email sono obbligatori.');
  if (db.users.some(u => u.email === email && u.id !== id)) return alert('Email già usata da un altro utente.');
  if (!id && pass.length < 6) return alert('La password deve avere almeno 6 caratteri.');
  if (id && pass && pass.length < 6) return alert('La password deve avere almeno 6 caratteri.');
  const data = {name, email, role, phone: val('u-phone').trim(), color: val('u-color')};
  if (id) {
    const u = byId(db.users, id);
    if (u.role === 'admin' && role !== 'admin' && db.users.filter(x => x.role === 'admin').length < 2) return alert('Deve restare almeno un utente titolare.');
    Object.assign(u, data);
    if (pass) u.pass = hashPw(pass);
  } else {
    db.users.push({id:'u' + uid(), ...data, pass:hashPw(pass)});
  }
  closeModal();
  commit();
}
function delUser(id){
  if (!requireAdmin()) return;
  const u = byId(db.users, id);
  if (u.id === me.id) return alert('Non puoi eliminare l\'utente con cui sei collegato.');
  if (u.role === 'admin' && db.users.filter(x => x.role === 'admin').length < 2) return alert('Deve restare almeno un utente titolare.');
  if (!confirm(`Eliminare l'utente ${u.name}?`)) return;
  db.users = db.users.filter(x => x.id !== id);
  commit();
}

/* ---------- TEMA, OROLOGIO, SALUTO ---------- */
const ICONS = {dash:'📊', agenda:'📅', giro:'🛠️', clienti:'👥', magazzino:'📦', promemoria:'🔔', messaggi:'💬',
  fatture:'🧾', report:'📈', automazioni:'⚙️', dati:'🗂️', qr:'🔳', impost:'🔧'};
function applyTheme(){
  let t = 'light';
  try { t = localStorage.getItem('wg-theme') || 'light'; } catch(e) {}
  document.documentElement.setAttribute('data-theme', t);
  document.querySelectorAll('.tlabel').forEach(el => { el.textContent = t === 'dark' ? 'Tema chiaro' : 'Tema scuro'; });
}
function toggleTheme(){
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('wg-theme', next); } catch(e) {}
  applyTheme();
}
function updateClock(){
  const txt = new Date().toLocaleString('it-IT', {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
  document.querySelectorAll('.clock').forEach(el => { el.textContent = txt; });
}
function saluto(){
  const h = new Date().getHours();
  return h < 12 ? 'Buongiorno' : h < 18 ? 'Buon pomeriggio' : 'Buonasera';
}

/* ---------- AVVIO ---------- */
applyTheme();
let db = load();
boot();
updateClock();
setInterval(updateClock, 30000);
</script>
